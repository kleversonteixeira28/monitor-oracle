global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    servidor: oracle-monitor

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { instancia: "servidor" }

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Para monitorar OUTRA maquina: instale o node_exporter nela e some aqui.
  # Nao publique a 9100 na internet - use VPN (tailscale/wireguard).
  # - job_name: loja-piperno
  #   static_configs:
  #     - targets: ["10.0.0.5:9100"]
